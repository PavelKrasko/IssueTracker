apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: issuetracker-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: issuetracker-client
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: issuetracker-server
                port:
                  number: 8080
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: issuetracker-client
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: issuetracker-server
                port:
                  number: 8080