apiVersion: apps/v1
kind: Deployment
metadata:
  name: issuetracker-client
  labels:
    app: issuetracker-client
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: issuetracker-client
  template:
    metadata:
      labels:
        app: issuetracker-client
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: client
          image: {{ .Values.image.registry }}/{{ .Values.image.client.name }}:{{ .Values.image.client.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80