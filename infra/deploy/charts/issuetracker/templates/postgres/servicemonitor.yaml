apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-{{ .Values.postgres.name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.postgres.name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: metrics
      interval: 30s