apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.backend.existingSecret }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: {{ .Values.backend.existingSecret }}
  dataFrom:
    - extract:
        key: {{ .Values.vaultPath }}/backend
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgres.existingSecret }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: {{ .Values.postgres.existingSecret }}
  dataFrom:
    - extract:
        key: {{ .Values.vaultPath }}/postgres