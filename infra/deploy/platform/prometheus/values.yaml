grafana:
  adminPassword: change-me
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc:3100
      access: proxy

prometheus:
  prometheusSpec:
    retention: 7d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        memory: 400Mi
      limits:
        memory: 1Gi

nodeExporter:
  enabled: true

kubelet:
  serviceMonitor:
    cAdvisor: true

alertmanager:
  enabled: false