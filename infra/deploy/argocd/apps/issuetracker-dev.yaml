apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: issuetracker-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PavelKrasko/IssueTracker
    targetRevision: develop
    path: infra/deploy/charts/issuetracker
    helm:
      releaseName: it
      valueFiles:
        - ../../environments/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: issuetracker-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true