apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/hashicorp/vault-helm
      targetRevision: v0.34.1
      path: .
      helm:
        releaseName: vault
        valueFiles:
          - $values/infra/deploy/platform/vault/values.yaml
    - repoURL: https://github.com/PavelKrasko/IssueTracker
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true