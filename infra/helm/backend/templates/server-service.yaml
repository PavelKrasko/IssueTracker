apiVersion: v1
kind: Service
metadata:
  name: issuetracker-server
  labels:
    app: issuetracker-server
    app.kubernetes.io/name: issuetracker-server
    app.kubernetes.io/instance: {{ .Release.Name }}
  spec:
    selector:
      app: issuetracker-server
    ports:
      - name: http
        port: {{ .Values.service.port }}
        targetPort: {{ .Values.service.port }}